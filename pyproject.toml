[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "radar-sixel"
dynamic = ["version"]
description = "Show NOAA NEXRAD/TDWR radar loops as sixel images in the terminal"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "MonkeeSage", email = "monkeesage@gmail.com" }]
keywords = ["radar", "nexrad", "noaa", "weather", "sixel", "terminal"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = [
    "numpy>=1.24",
    "pillow>=10.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
radar-sixel = "radar_sixel.cli:main"

[tool.hatch.version]
path = "src/radar_sixel/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md", "/pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
